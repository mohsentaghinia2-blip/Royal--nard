<style>
:root{color-scheme:dark;--gold:#e0bd78;--ink:#17120e;--felt:#422719;--cream:#f6e8c8;--charcoal:#25272a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100b08;color:var(--cream);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{height:100%;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:radial-gradient(ellipse at center,#392417 0,#120c08 75%)}
#hud{position:absolute;z-index:4;top:max(6px,env(safe-area-inset-top));left:8px;right:8px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}
.hud-group{display:flex;align-items:center;gap:5px;pointer-events:auto}.pill{border:1px solid #e0bd7866;background:#17100dcc;color:#f7e6c1;border-radius:999px;padding:5px 9px;font-size:11px;line-height:1.2;white-space:nowrap;box-shadow:0 2px 8px #0005}.turn-pill{display:flex;align-items:center;gap:6px}.turn-dot{width:12px;height:12px;border-radius:50%;border:1px solid #d8bb7d;box-shadow:0 0 8px #e0bd7855}.turn-dot.white{background:var(--cream)}.turn-dot.black{background:#202124}.hud-button{border:1px solid #e0bd7866;background:#17100dcc;color:#f7e6c1;border-radius:50%;width:34px;height:34px;padding:0;font-size:17px;display:grid;place-items:center;pointer-events:auto}
#gameStage{position:relative;display:flex;align-items:center;justify-content:center;gap:9px;width:100%;flex:1;min-height:0;direction:ltr}
#boardWrap{position:relative;width:min(calc(100vw - 100px),calc((100dvh - 2px)*1.428571));max-height:100dvh;aspect-ratio:10/7;flex:0 1 auto;filter:drop-shadow(0 12px 28px #0009)}
canvas{display:block;width:100%;height:100%;touch-action:manipulation;outline:none}
#scoreRail{width:78px;flex:0 0 78px;display:flex;flex-direction:column;gap:9px;align-items:stretch;direction:rtl}
.score-card{border:1px solid #d8b16b99;border-radius:12px;background:linear-gradient(145deg,#392619ed,#17100ff2);box-shadow:0 3px 12px #0008;padding:9px 4px;text-align:center;min-width:0}

#menu{position:absolute;z-index:10;top:48px;right:9px;width:min(270px,86vw);display:none;padding:12px;border-radius:15px;border:1px solid #d8b16b88;background:#21160ff5;box-shadow:0 15px 45px #000b}
#menu.open{display:grid;gap:8px}#menu h2{font-size:14px;margin:0;color:var(--gold)}#menu p{font-size:11px;line-height:1.7;color:#cdbb9c;margin:0}#menu button,#menu select{width:100%;border:1px solid #d8b16b55;background:#382619;color:#f8edda;border-radius:9px;padding:10px;font:inherit;font-size:12px}#menu .menu-row{display:grid;grid-template-columns:1fr 1fr;gap:7px}
@media (orientation:landscape){#hud{top:max(5px,env(safe-area-inset-top));left:10px;right:10px}.pill{font-size:10px;padding:4px 8px}}
@media (orientation:portrait){#gameStage{position:absolute;inset:0;display:block;width:100%;height:100%;flex:none}#boardWrap{position:absolute;left:0;top:50%;transform:translateY(-50%);width:100vw;max-height:none;flex:none}#scoreRail{position:absolute;z-index:3;top:max(48px,calc(env(safe-area-inset-top) + 42px));left:8px;right:8px;width:auto;display:flex;flex-direction:row;justify-content:center;gap:8px}#scoreRail .score-card{width:86px;padding:5px 6px}#scoreRail .score-number{font-size:21px}#scoreRail .score-target{padding:5px 8px;min-width:80px}#hud{top:max(5px,env(safe-area-inset-top))}}
@media (max-height:390px) and (orientation:landscape){#hud{top:3px}.hud-button{width:29px;height:29px}#scoreRail{width:70px;flex-basis:70px;gap:5px}.score-card{padding:5px 3px}.score-number{font-size:23px}.score-label,.score-target{font-size:9px}#boardWrap{width:min(calc(100vw - 84px),calc((100dvh - 2px)*1.428571))}}
</style>

<body>
<div id="app">
  <div id="hud">
    <div class="hud-group"><button id="menuButton" class="hud-button" aria-label="تنظیمات">⋮</button></div>
  </div>
  <div id="gameStage">
    <aside id="scoreRail" aria-label="امتیاز مسابقه">
      <div class="score-card"><div class="score-label">سفید</div><div class="score-number" id="scoreWhite">۰</div></div>
      <div class="score-card"><div class="score-label">تیره</div><div class="score-number" id="scoreDark">۰</div></div>
      <div class="score-target" id="scoreTarget">هدف مسابقه<br><strong id="targetValue">۵</strong></div>
    </aside>
    <div id="boardWrap"><canvas id="board" width="1000" height="700" aria-label="تخته نرد؛ برای انداختن تاس وسط تخته را لمس کنید"></canvas></div>
  </div>
  <div id="toast" role="status" aria-live="polite"></div>
  <section id="menu" aria-label="تنظیمات بازی">
    <h2>تخته‌نرد سلطنتی</h2><p>تنظیمات در همین صفحه باز می‌شود؛ فضای تخته برای بازی آزاد می‌ماند.</p>
    <div class="menu-row"><button id="aiMode">🤖 مقابل رایانه</button><button id="localMode">👥 دونفره</button></div>
    <button id="rollButton">🎲 انداختن تاس</button><button id="undoButton">↶ بازگشت یک مرحله</button><button id="restartButton">بازی جدید</button>
    <button id="targetButton">تغییر هدف مسابقه</button><button id="closeMenu">بستن منو</button>
  </section>
</div>
<script>
(()=>{'use strict';
const canvas=document.getElementById('board'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const W=1000,H=700,STORE='royal-nard-match-v10';
const names=['سفید','تیره'],fa=n=>String(n).replace(/[0-9]/g,d=>'۰۱۲۳۴۵۶۷۸۹'[+d]);
const diceGlyph=['','⚀','⚁','⚂','⚃','⚄','⚅'];
let state,mode='ai',selected=null,history=[],legal=[],busy=false,matchScore=[0,0],targetScore=5,rollNonce=0;
const xs=[66,137,208,279,350,421,579,650,721,792,863,934];
// Screen mapping: top row 12..23 left-to-right; bottom row 11..0 left-to-right.
const topPoint=j=>12+j,bottomPoint=j=>11-j;
function initial(){const p=Array(24).fill(0);p[23]=2;p[12]=5;p[7]=3;p[5]=5;p[0]=-2;p[11]=-5;p[16]=-3;p[18]=-5;return {p,bar:[0,0],off:[0,0],player:0,dice:[],rolled:false,over:false};}
function own(v,p){return p===0?v>0:v<0}
function home(p,i){return p===0?i<=5:i>=18}
function allHome(pos,bar,p){return !bar[p]&&pos.every((v,i)=>!own(v,p)||home(p,i))}
function hasFarther(pos,p,i){return p===0?pos.some((v,j)=>j>i&&j<=5&&own(v,p)):pos.some((v,j)=>j<i&&j>=18&&own(v,p))}
function dest(p,from,d){return from==='bar'?(p===0?24-d:d-1):from+(p===0?-d:d)}
function canBear(pos,bar,p,i,d){if(!home(p,i)||!allHome(pos,bar,p))return false;const to=p===0?i-d:i+d;if(to>=0&&to<24)return false;if(p===0)return d===i+1||!hasFarther(pos,p,i);return d===24-i||!hasFarther(pos,p,i)}
function getMoves(pos,bar,p,d){const out=[];if(bar[p]){const to=dest(p,'bar',d);if(to>=0&&to<24&&(pos[to]===0||own(pos[to],p)||Math.abs(pos[to])===1))out.push({from:'bar',to,d});return out;}
 for(let i=0;i<24;i++)if(own(pos[i],p)){const to=dest(p,i,d);if(to>=0&&to<24){if(pos[to]===0||own(pos[to],p)||Math.abs(pos[to])===1)out.push({from:i,to,d});}else if(canBear(pos,bar,p,i,d))out.push({from:i,to:'off',d});}return out;}
function applyMove(pos,bar,off,p,m){const a=pos.slice(),b=bar.slice(),o=off.slice();if(m.from==='bar')b[p]--;else a[m.from]+=p===0?-1:1;if(m.to==='off'){o[p]++;return {p:a,bar:b,off:o};}if(a[m.to]!==0&&!own(a[m.to],p)&&Math.abs(a[m.to])===1){b[1-p]++;a[m.to]=0;}a[m.to]+=p===0?1:-1;return {p:a,bar:b,off:o};}
function enumerate(pos,bar,off,p,dice,seq=[]){if(!dice.length)return [{seq,pos,bar,off}];let out=[];for(let k=0;k<dice.length;k++){const d=dice[k],rest=dice.filter((_,i)=>i!==k),ms=getMoves(pos,bar,p,d);for(const m of ms){const r=applyMove(pos,bar,off,p,m);out.push(...enumerate(r.p,r.bar,r.off,p,rest,seq.concat(m)));}}return out.length?out:[{seq,pos,bar,off}];}
function recalc(){if(!state.dice.length){legal=[];return;}let all=enumerate(state.p,state.bar,state.off,state.player,state.dice.slice());const max=Math.max(0,...all.map(a=>a.seq.length));all=all.filter(a=>a.seq.length===max);if(state.dice.length===2&&state.dice[0]!==state.dice[1]&&max===1){const high=Math.max(...all.map(a=>a.seq[0]?.d||0));if(all.some(a=>(a.seq[0]?.d||0)===high))all=all.filter(a=>(a.seq[0]?.d||0)===high);}legal=all;}
function available(){return legal.filter(a=>a.seq.length).map(a=>a.seq[0]);}
function snapshot(){history.push(JSON.stringify(state));if(history.length>100)history.shift();}
function tell(t){$('toast').textContent=t;}
function persist(){try{localStorage.setItem(STORE,JSON.stringify({score:matchScore,target:targetScore}));}catch(e){}}
function load(){try{const v=JSON.parse(localStorage.getItem(STORE)||'null');if(v&&Array.isArray(v.score)&&v.score.length===2){matchScore=v.score.map(n=>Math.max(0,Number(n)||0));targetScore=Math.min(15,Math.max(1,Number(v.target)||5));}}catch(e){}}
function endTurn(){state.player=1-state.player;state.dice=[];state.rolled=false;selected=null;legal=[];busy=false;render();if(mode==='ai'&&state.player===1&&!state.over)setTimeout(aiTurn,500);}
function award(winner){const loser=1-winner;let pts=1,kind='برد معمولی';if(state.off[loser]===0){const inWinnerHome=state.p.some((v,i)=>own(v,loser)&&(winner===0?i<=5:i>=18));if(state.bar[loser]>0||inWinnerHome){pts=3;kind='بک‌گامون';}else{pts=2;kind='گامون';}}matchScore[winner]+=pts;persist();tell(`${names[winner]} برنده شد؛ ${kind}، ${fa(pts)} امتیاز.`+(matchScore[winner]>=targetScore?' برندهٔ مسابقه!':''));render();}
function perform(m){const valid=available().some(a=>a.from===m.from&&a.to===m.to&&a.d===m.d);if(!valid)return false;snapshot();const r=applyMove(state.p,state.bar,state.off,state.player,m);state.p=r.p;state.bar=r.bar;state.off=r.off;const di=state.dice.indexOf(m.d);if(di>=0)state.dice.splice(di,1);selected=null;if(state.off[state.player]>=15){state.over=true;const w=state.player;award(w);return true;}if(!state.dice.length){endTurn();return true;}recalc();if(!available().length){endTurn();return true;}render();return true;}
function roll(isAI=false){if(state.rolled||state.over||busy||(mode==='ai'&&state.player===1&&!isAI))return;snapshot();const a=1+(Math.random()*6|0),b=1+(Math.random()*6|0);state.dice=a===b?[a,a,a,a]:[a,b];state.rolled=true;selected=null;recalc();if(!available().length){render();tell(`${names[state.player]} حرکت قانونی ندارد؛ نوبت رد می‌شود.`);const nonce=++rollNonce;setTimeout(()=>{if(nonce===rollNonce&&state.rolled&&!available().length)endTurn();},700);return;}tell('مهرهٔ دارای حاشیهٔ طلایی را انتخاب کنید، سپس مقصد را لمس کنید.');render();}
function aiTurn(){if(mode!=='ai'||state.player!==1||state.over)return;busy=false;roll(true);if(!state.rolled)return;busy=true;let guard=0;function step(){if(mode!=='ai'||state.player!==1||state.over||!state.rolled||guard++>8){busy=false;render();return;}const ms=available();if(!ms.length){endTurn();return;}let best=ms[0],bestScore=-1e9;for(const m of ms){const r=applyMove(state.p,state.bar,state.off,1,m);let score=Math.random()*0.4+(r.off[1]-state.off[1])*12+(r.bar[0]-state.bar[0])*7;if(m.to!=='off'&&Math.abs(r.p[m.to])===2)score+=1;if(m.to!=='off'&&Math.abs(r.p[m.to])===1)score-=0.4;if(m.from==='bar')score+=3;if(score>bestScore){bestScore=score;best=m;}}perform(best);if(state.player===1&&state.rolled&&!state.over)setTimeout(step,300);else busy=false;}setTimeout(step,300);}
function pointXY(i){let j;if(i>=12){j=i-12;const n=Math.min(Math.abs(state.p[i]),5);return {x:xs[j],y:n?57+(n-1)*31:238};}j=11-i;const n=Math.min(Math.abs(state.p[i]),5);return {x:xs[j],y:n?643-(n-1)*31:462};}
function checker(px,py,fill,stroke,r=21){ctx.beginPath();ctx.arc(px,py,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();ctx.lineWidth=3;ctx.strokeStyle=stroke;ctx.stroke();ctx.beginPath();ctx.arc(px,py,r-6,0,Math.PI*2);ctx.strokeStyle='#ffffff33';ctx.lineWidth=1.2;ctx.stroke();}
function rounded(x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.stroke();}}
function drawDie(cx,cy,d,active,player){
 const size=72,half=size/2,light=player===0;
 const face=active?(light?'#fff5dc':'#292725'):'#292725';
 const pip=active?(light?'#24170d':'#f3dfb4'):'#f3dfb4';
 rounded(cx-half,cy-half,size,size,12,face,active?'#f2d18b':'#88704c');
 if(!d){ctx.fillStyle=pip;ctx.font='bold 35px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎲',cx,cy+1);return;}
 const a=17,mid=0,positions={1:[[mid,mid]],2:[[-a,-a],[a,a]],3:[[-a,-a],[mid,mid],[a,a]],4:[[-a,-a],[a,-a],[-a,a],[a,a]],5:[[-a,-a],[a,-a],[mid,mid],[-a,a],[a,a]],6:[[-a,-a],[a,-a],[-a,mid],[a,mid],[-a,a],[a,a]]};
 ctx.fillStyle=pip;for(const [dx,dy] of positions[d]){ctx.beginPath();ctx.arc(cx+dx,cy+dy,5.8,0,Math.PI*2);ctx.fill();}
}
function draw(){ctx.clearRect(0,0,W,H);const wood=ctx.createLinearGradient(0,0,W,H);wood.addColorStop(0,'#986943');wood.addColorStop(.25,'#4c2b19');wood.addColorStop(.56,'#2e1a10');wood.addColorStop(.82,'#71482a');wood.addColorStop(1,'#28160c');ctx.fillStyle=wood;ctx.fillRect(0,0,W,H);
 for(let i=0;i<35;i++){const y=10+i*20;ctx.beginPath();ctx.moveTo(8,y);ctx.bezierCurveTo(180,y-8,330,y+6,490,y);ctx.strokeStyle=i%2?'#e0bd7818':'#12090526';ctx.lineWidth=1.4;ctx.stroke();ctx.beginPath();ctx.moveTo(510,y);ctx.bezierCurveTo(650,y-5,820,y+8,992,y);ctx.stroke();}
 const felt=ctx.createLinearGradient(0,20,0,680);felt.addColorStop(0,'#4d2e1d');felt.addColorStop(.5,'#351f14');felt.addColorStop(1,'#4b2a19');rounded(12,12,976,676,18,felt,'#d9b66b');ctx.strokeStyle='#1a100a';ctx.lineWidth=2;ctx.strokeRect(25,25,950,650);
 const barGrad=ctx.createLinearGradient(470,0,530,0);barGrad.addColorStop(0,'#25150c');barGrad.addColorStop(.5,'#bd9251');barGrad.addColorStop(1,'#25150c');ctx.fillStyle=barGrad;ctx.fillRect(474,28,52,644);
 for(let j=0;j<12;j++){const px=xs[j],col=j%2===0;ctx.beginPath();ctx.moveTo(px-29,36);ctx.lineTo(px+29,36);ctx.lineTo(px,252);ctx.closePath();const g=ctx.createLinearGradient(px,36,px,252);g.addColorStop(0,col?'#b28a53':'#895347');g.addColorStop(1,col?'#65452d':'#543126');ctx.fillStyle=g;ctx.fill();ctx.strokeStyle='#e3c58a30';ctx.stroke();ctx.beginPath();ctx.moveTo(px-29,664);ctx.lineTo(px+29,664);ctx.lineTo(px,448);ctx.closePath();const b=ctx.createLinearGradient(px,448,px,664);b.addColorStop(0,col?'#65452d':'#543126');b.addColorStop(1,col?'#b28a53':'#895347');ctx.fillStyle=b;ctx.fill();ctx.stroke();
 const ti=topPoint(j),bi=bottomPoint(j);ctx.fillStyle='#f4d99c';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='alphabetic';ctx.fillText(String(ti+1),px,31);ctx.fillText(String(bi+1),px,695);
 for(let k=0;k<Math.min(Math.abs(state.p[ti]),5);k++)checker(px,57+k*31,state.p[ti]>0?'#f6e8c8':'#25272a',state.p[ti]>0?'#a58a5e':'#090d0f');for(let k=0;k<Math.min(Math.abs(state.p[bi]),5);k++)checker(px,643-k*31,state.p[bi]>0?'#f6e8c8':'#25272a',state.p[bi]>0?'#a58a5e':'#090d0f');
 if(Math.abs(state.p[ti])>5){checker(px,57+4*31,'#4a2c17','#d8b16b',10);ctx.fillStyle='#fff0cc';ctx.font='bold 10px system-ui';ctx.fillText(String(Math.abs(state.p[ti])),px,61+4*31);}if(Math.abs(state.p[bi])>5){checker(px,643-4*31,'#4a2c17','#d8b16b',10);ctx.fillStyle='#fff0cc';ctx.font='bold 10px system-ui';ctx.fillText(String(Math.abs(state.p[bi])),px,647-4*31);}
 }
 // Bar checkers and embedded bearing-off zones
 for(let p=0;p<2;p++)for(let k=0;k<Math.min(state.bar[p],5);k++)checker(500,p===0?150+k*30:550-k*30,p===0?'#f6e8c8':'#25272a',p===0?'#a58a5e':'#090d0f');
 rounded(452,43,96,37,8,'#1d1009cc','#d8b16b88');ctx.fillStyle='#f0d18c';ctx.font='bold 12px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(`بار ${fa(state.bar[0])} / ${fa(state.bar[1])}`,500,61);
 rounded(444,82,112,36,8,'#24170edb','#d8b16b');ctx.fillStyle='#f4dfb0';ctx.font='bold 12px system-ui';ctx.fillText('خروج تیره ↑',500,100);
 rounded(444,582,112,36,8,'#24170edb','#d8b16b');ctx.fillStyle='#f4dfb0';ctx.fillText('خروج سفید ↓',500,600);
 // Dice are part of the board and indicate whose turn it is by color
 const dice=state.dice;const d1=dice[0]||0,d2=dice[1]||dice[2]||dice[3]||0;const whiteTurn=state.player===0;drawDie(461,350,d1,true,state.player);drawDie(539,350,d2,true,state.player);if(!state.rolled){ctx.fillStyle='#f5d99a';ctx.font='bold 15px system-ui';ctx.textAlign='center';ctx.fillText('برای تاس لمس کنید',500,405);}else if(mode==='local'&&state.player===1){/* black's dice are visually darkened */}
 // Highlight legal sources/destinations
 if(state.rolled&&!state.over){const ms=available();if(selected===null){const sources=new Set(ms.map(m=>m.from));for(const i of sources){if(i==='bar'){ctx.strokeStyle='#ffe29b';ctx.lineWidth=4;ctx.strokeRect(478,122,44,540);}else{const v=pointXY(i);ctx.beginPath();ctx.arc(v.x,v.y,23,0,Math.PI*2);ctx.strokeStyle='#ffe29b';ctx.lineWidth=4;ctx.stroke();}}}else{for(const m of ms.filter(m=>m.from===selected)){if(m.to==='off')continue;const v=pointXY(m.to);ctx.beginPath();ctx.arc(v.x,v.y,22,0,Math.PI*2);ctx.fillStyle='#e6c47a55';ctx.fill();ctx.strokeStyle='#ffe29b';ctx.lineWidth=3;ctx.stroke();}}}
 // Current player's turn color is also shown by the in-board dice frame
 if(state.player===1){ctx.strokeStyle='#111';ctx.lineWidth=3;ctx.strokeRect(449,323,102,54);}else{ctx.strokeStyle='#f5dfb0';ctx.lineWidth=2;ctx.strokeRect(449,323,102,54);}

}
function drawRoyalFrame(){
 // Double gold inlay around the board, with engraved corner scrollwork and side rosettes.
 ctx.save();
 ctx.lineJoin='round';ctx.lineCap='round';
 const gold='#e8c77f',light='#f7e3ac',shadow='#6f4822';
 ctx.strokeStyle=shadow;ctx.lineWidth=5;ctx.strokeRect(5,5,990,690);
 ctx.strokeStyle=gold;ctx.lineWidth=2.4;ctx.strokeRect(7.5,7.5,985,685);
 ctx.strokeStyle='#f6dfa0';ctx.lineWidth=1;ctx.strokeRect(14,14,972,672);
 // Small engraved diamond studs on the side rails.
 for(const yy of [95,175,255,445,525,605]){
   for(const xx of [14,986]){
     ctx.beginPath();ctx.moveTo(xx,yy-5);ctx.lineTo(xx+4*(xx<500?1:-1),yy);ctx.lineTo(xx,yy+5);ctx.lineTo(xx-4*(xx<500?1:-1),yy);ctx.closePath();
     ctx.fillStyle=gold;ctx.fill();ctx.strokeStyle=shadow;ctx.lineWidth=1;ctx.stroke();
   }
 }
 // Four matching royal corner flourishes, kept in the frame margin so they don't cover checkers.
 function corner(cx,cy,sx,sy){
   ctx.save();ctx.translate(cx,cy);ctx.scale(sx,sy);
   ctx.strokeStyle=gold;ctx.lineWidth=2.2;ctx.beginPath();
   ctx.moveTo(0,24);ctx.bezierCurveTo(0,10,3,2,17,2);ctx.bezierCurveTo(27,2,28,12,20,15);ctx.bezierCurveTo(14,17,10,11,14,8);ctx.stroke();
   ctx.beginPath();ctx.moveTo(2,24);ctx.bezierCurveTo(12,24,17,20,19,13);ctx.bezierCurveTo(22,6,29,7,31,13);ctx.stroke();
   ctx.beginPath();ctx.moveTo(5,25);ctx.lineTo(9,29);ctx.lineTo(13,25);ctx.lineTo(9,21);ctx.closePath();ctx.fillStyle=light;ctx.fill();
   ctx.restore();
 }
 corner(18,17,1,1);corner(982,17,-1,1);corner(18,683,1,-1);corner(982,683,-1,-1);
 // A restrained central crest on the upper and lower rails.
 for(const yy of [17,683]){
   ctx.beginPath();ctx.moveTo(500,yy-5);ctx.lineTo(505,yy);ctx.lineTo(500,yy+5);ctx.lineTo(495,yy);ctx.closePath();ctx.fillStyle=light;ctx.fill();
   ctx.beginPath();ctx.arc(500,yy,8,0,Math.PI*2);ctx.strokeStyle=gold;ctx.lineWidth=1;ctx.stroke();
 }
 ctx.restore();
}
function render(){draw();$('rollButton').disabled=state.rolled||state.over||busy||(mode==='ai'&&state.player===1);$('undoButton').disabled=!history.length;$('scoreWhite').textContent=fa(matchScore[0]);$('scoreDark').textContent=fa(matchScore[1]);$('targetValue').textContent=fa(targetScore);}
function bearingTap(){if(selected===null||selected==='bar')return false;const m=available().find(a=>a.from===selected&&a.to==='off');if(m)return perform(m);tell('این مهره هنوز اجازهٔ خروج ندارد.');return true;}
function tap(e){if(state.over||busy||(mode==='ai'&&state.player===1))return;const rect=canvas.getBoundingClientRect(),px=(e.clientX-rect.left)*W/rect.width,py=(e.clientY-rect.top)*H/rect.height;
 // embedded roll area
 if(px>420&&px<580&&py>300&&py<415&&!state.rolled){roll();return;}
 if(!state.rolled){tell('ابتدا تاس‌های وسط تخته را لمس کنید.');return;}
 // Bearing off zones are part of the board
 if(px>435&&px<565&&py>570&&py<630){if(state.player===0)bearingTap();else tell('این محل خروج مهره‌های سفید است.');return;}
 if(px>435&&px<565&&py>75&&py<125){if(state.player===1)bearingTap();else tell('این محل خروج مهره‌های تیره است.');return;}
 if(px>470&&px<530&&py>125&&py<575&&state.bar[state.player]>0){selected='bar';render();tell('مهرهٔ روی بار انتخاب شد؛ خانهٔ ورود را لمس کنید.');return;}
 let nearest=xs.map((v,i)=>({i,d:Math.abs(v-px)})).sort((a,b)=>a.d-b.d)[0];if(!nearest||nearest.d>34)return;const idx=py<350?topPoint(nearest.i):bottomPoint(nearest.i);
 if(state.bar[state.player]>0){const m=available().find(a=>a.from==='bar'&&a.to===idx);if(m){perform(m);return;}selected='bar';render();tell('تا وقتی مهره روی بار دارید، ابتدا باید آن را وارد کنید.');return;}
 if(selected!==null){const m=available().find(a=>a.from===selected&&a.to===idx);if(m){perform(m);return;}}
 if(own(state.p[idx],state.player)){selected=idx;tell('اکنون خانهٔ مقصد با حاشیهٔ طلایی مشخص شده است.');}else{selected=null;tell('مهرهٔ خود را انتخاب کنید.');}render();}
canvas.addEventListener('pointerup',tap);$('menuButton').addEventListener('click',()=>$('menu').classList.toggle('open'));$('closeMenu').addEventListener('click',()=>$('menu').classList.remove('open'));$('rollButton').addEventListener('click',()=>{roll();$('menu').classList.remove('open');});
$('undoButton').addEventListener('click',()=>{if(!history.length)return;rollNonce++;busy=false;state=JSON.parse(history.pop());selected=null;recalc();render();tell('یک مرحله بازگشت انجام شد.');});
$('restartButton').addEventListener('click',()=>{rollNonce++;state=initial();history=[];selected=null;busy=false;legal=[];render();$('menu').classList.remove('open');tell('دست جدید آماده است؛ تاس را لمس کنید.');});
$('targetButton').addEventListener('click',()=>{const v=prompt('هدف مسابقه از ۱ تا ۱۵ امتیاز:',String(targetScore));if(v===null)return;const n=Number(v);if(Number.isInteger(n)&&n>=1&&n<=15){targetScore=n;persist();render();tell('هدف مسابقه ذخیره شد.');}else alert('لطفاً عدد صحیح بین ۱ تا ۱۵ وارد کنید.');});
function setMode(m){mode=m;rollNonce++;state=initial();history=[];selected=null;busy=false;legal=[];render();$('menu').classList.remove('open');tell(m==='ai'?'حالت مقابل رایانه انتخاب شد.':'حالت دونفره انتخاب شد.');}
$('aiMode').addEventListener('click',()=>setMode('ai'));$('localMode').addEventListener('click',()=>setMode('local'));
load();state=initial();render();
if('serviceWorker' in navigator && location.protocol.startsWith('http')){navigator.serviceWorker.register('./sw.js').catch(()=>{});}
})();
</script>
